<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UroScore Manager</title>
    <!-- Tailwind via CDN for simplicity, though PostCSS is recommended for prod -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <style>
      body { font-family: 'Inter', sans-serif; }
      
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Print Styles */
      @media print {
        @page { size: A4; margin: 1cm; }
        body { background-color: white; color: black; }
        .no-print, nav, aside, button, input, select, .sidebar-container { display: none !important; }
        main { margin-left: 0 !important; padding: 0 !important; height: auto !important; overflow: visible !important; }
        table { width: 100% !important; border-collapse: collapse !important; font-size: 10pt !important; }
        th, td { border: 1px solid #ddd !important; padding: 8px !important; }
        thead { background-color: #f3f4f6 !important; -webkit-print-color-adjust: exact; }
        .print-container { display: block !important; height: auto !important; overflow: visible !important; }
        .report-header { display: block !important; margin-bottom: 20px; text-align: center; }
      }
      .report-header { display: none; }
    </style>
  <script type="importmap">
{

    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
